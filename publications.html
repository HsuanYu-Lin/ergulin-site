<dialog class="lightbox" id="lightbox" aria-label="Image viewer">
  <div class="lb-inner" id="lb-inner">
    <img id="lb-img" src="" alt="">
    <div class="lb-caption" id="lb-cap"></div>
  </div>
  <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous">&#8249;</button>
  <button class="lb-btn lb-next" id="lb-next" aria-label="Next">&#8250;</button>
  <button class="lb-close" id="lb-close" aria-label="Close">&#215;</button>
</dialog>
<script>
(function () {
  var dlg = document.getElementById('lightbox');
  if (!dlg || !dlg.showModal) return;
  var img = document.getElementById('lb-img'), cap = document.getElementById('lb-cap');
  var links = Array.prototype.slice.call(document.querySelectorAll('.works-grid .work a, .press-scan a'));
  var i = 0;
  function show(n) {
    i = (n + links.length) % links.length;
    var a = links[i];
    img.src = a.getAttribute('href');
    var fc = a.parentNode.querySelector('figcaption');
    var t = fc ? fc.querySelector('.title') : null, m = fc ? fc.querySelector('.meta') : null;
    cap.innerHTML = fc ? (t ? '<span class="t">' + t.textContent + '</span>' : '') + (m ? m.textContent : (t ? '' : fc.textContent)) : '';
    img.alt = a.querySelector('img') ? a.querySelector('img').alt : '';
  }
  links.forEach(function (a, n) {
    a.addEventListener('click', function (e) { e.preventDefault(); show(n); dlg.showModal(); });
  });
  document.getElementById('lb-prev').addEventListener('click', function (e) { e.stopPropagation(); show(i - 1); });
  document.getElementById('lb-next').addEventListener('click', function (e) { e.stopPropagation(); show(i + 1); });
  document.getElementById('lb-close').addEventListener('click', function () { dlg.close(); });
  document.getElementById('lb-inner').addEventListener('click', function (e) { if (e.target !== img) dlg.close(); });
  img.addEventListener('click', function (e) { e.stopPropagation(); show(i + 1); });
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') show(i + 1);
    if (e.key === 'ArrowLeft') show(i - 1);
  });
})();
</script>
</body>
</html>
