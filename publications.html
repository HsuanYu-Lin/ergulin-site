<main>

<div class="section-title">
  <h1>出版品</h1>
  <span class="sub">Publications</span>
</div>
<div class="works-grid natural">
  <figure class="work">
    <a href="assets/img/pub-1991.jpg"><img src="assets/img/pub-1991.jpg" alt="書封：雙谷燒陶小集" loading="lazy"></a>
    <figcaption>雙谷燒陶小集（1989，遠景出版社）</figcaption>
  </figure>
  <figure class="work">
    <a href="assets/img/pub-1992.jpg"><img src="assets/img/pub-1992.jpg" alt="書封：茶禪" loading="lazy"></a>
    <figcaption>茶禪（1992，漢藝色研出版社）</figcaption>
  </figure>
  <figure class="work">
    <a href="assets/img/pub-2010.jpg"><img src="assets/img/pub-2010.jpg" alt="書封：台灣名家美術100：陶瓷 林振龍" loading="lazy"></a>
    <figcaption>台灣名家美術100：陶瓷 林振龍（2011，香柏樹文化出版社）</figcaption>
  </figure>
  <figure class="work">
    <a href="assets/img/pub-2012-shape.jpg"><img src="assets/img/pub-2012-shape.jpg" alt="書封：形色大地：林振龍陶藝展畫冊" loading="lazy"></a>
    <figcaption>形色大地：林振龍陶藝展畫冊（2012，台中屯區藝術中心出版）</figcaption>
  </figure>
  <figure class="work">
    <a href="assets/img/pub-2012-space.jpg"><img src="assets/img/pub-2012-space.jpg" alt="書封：空間釉彩：林振龍陶藝展畫冊" loading="lazy"></a>
    <figcaption>空間釉彩：林振龍陶藝展畫冊（2012，國立歷史博物館出版）</figcaption>
  </figure>
</div>

</main>
<footer class="site-footer">
  <div class="footer-inner">
    <span>© 林振龍 Lin Chen-Long · 瓷揚窯 Tsu Yang Kiln</span>
    <span>ergu.lin55@gmail.com · +886-2-2261-5388</span>
  </div>
</footer>

<dialog class="lightbox" id="lightbox">
  <img id="lb-img" src="" alt="">
  <div class="lb-caption" id="lb-cap"></div>
</dialog>
<script>
(function () {
  var dlg = document.getElementById('lightbox');
  if (!dlg || !dlg.showModal) return;
  var img = document.getElementById('lb-img');
  var cap = document.getElementById('lb-cap');
  document.querySelectorAll('.works-grid .work a').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      img.src = a.getAttribute('href');
      var fc = a.parentNode.querySelector('figcaption');
      cap.textContent = fc ? fc.textContent : '';
      dlg.showModal();
    });
  });
  dlg.addEventListener('click', function () { dlg.close(); });
})();
</script>

</body>
</html>
